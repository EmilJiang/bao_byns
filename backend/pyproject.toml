[project]
name = "sentra-api"
version = "0.1.0"
description = "Brand-scoped transaction risk API contract and mock service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.10,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "httpx2"]

[tool.pytest.ini_options]
pythonpath = ["."]
